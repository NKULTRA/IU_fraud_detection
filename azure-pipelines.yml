trigger: none

parameters:
  - name: simulateDrift
    displayName: 'Simulate drift for this run?'
    type: boolean
    default: true

schedules:
  - cron: "0 3 1 * *"
    displayName: Monthly retrain
    branches:
      include:
        - main
    always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'

  - script: pip install -r requirements.txt
    displayName: 'Install dependencies'

  - script: python scripts/blob_sync.py download
    displayName: 'Restore MLflow registry from Blob'
    env:
      AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)

  - script: python src/data_ingestion.py
    displayName: 'Ingest data from Blob'
    env:
      AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)

  - script: python src/preprocessing.py
    displayName: 'Build features'

  - script: python scripts/generate_drifted_data.py
    displayName: 'Generate drifted data for testing'
    condition: and(succeeded(), ${{ eq(parameters.simulateDrift, true) }})

  - script: |
      SIMULATE_DRIFT="${{ parameters.simulateDrift }}"
      if [ "${SIMULATE_DRIFT,,}" = "true" ]; then
        COMPARISON_FILE=data/fraud_oracle_drifted.csv
      else
        COMPARISON_FILE=data/fraud_oracle.csv
      fi
      python src/check_drift.py --new-data "$COMPARISON_FILE"
      EXIT_CODE=$?
      if [ $EXIT_CODE -eq 1 ]; then
        echo "##vso[task.setvariable variable=DRIFT_DETECTED]true"
      elif [ $EXIT_CODE -eq 0 ]; then
        echo "##vso[task.setvariable variable=DRIFT_DETECTED]false"
      else
        echo "Drift check failed unexpectedly (exit $EXIT_CODE)"
        exit $EXIT_CODE
      fi
    displayName: 'Check for data drift'

  - script: python src/train.py
    displayName: 'Retrain model'
    condition: or(eq(variables['DRIFT_DETECTED'], 'true'), eq(variables['Build.Reason'], 'Schedule'))

  - script: python scripts/promote_model.py
    displayName: 'Promote to production'
    condition: or(eq(variables['DRIFT_DETECTED'], 'true'), eq(variables['Build.Reason'], 'Schedule'))

  - script: python scripts/blob_sync.py upload
    displayName: 'Persist MLflow registry to Blob'
    condition: or(eq(variables['DRIFT_DETECTED'], 'true'), eq(variables['Build.Reason'], 'Schedule'))
    env:
      AZURE_STORAGE_CONNECTION_STRING: $(AZURE_STORAGE_CONNECTION_STRING)